<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bayes' theorem · marimo learn</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/pt-sans@5/400.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/pt-sans@5/700.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource-variable/lora@5/index.css">
    <style>
      /* Tokens follow marimo's DESIGN.md. The squares keep the notebook's
         original pairing: a yellow hypothesis and teal evidence. */
      :root {
        --paper: #ffffff;
        --ink: #0f172a;
        --muted: #64748b;
        --rule: #e2e8f0;
        --link: #0b68cb;
        --h: #fde68a;
        --not-h: #f1f5f9;
        --e-and-h: #1f6f80;
        --e-and-not-h: #7cc3cf;
        --text-font: "PT Sans", system-ui, sans-serif;
        --heading-font: "Lora Variable", Georgia, serif;
        color-scheme: light;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #181c1a;
          --ink: #eceeed;
          --muted: #aab2af;
          --rule: #3b403e;
          --link: #479bf5;
          --h: #6b5a1e;
          --not-h: #252927;
          --e-and-h: #4fb3c4;
          --e-and-not-h: #2a5d66;
          color-scheme: dark;
        }
      }

      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font: 400 1rem/1.75 var(--text-font);
      }

      marimo-cell,
      marimo-output {
        --marimo-cell-font: var(--text-font);
        --marimo-cell-heading-font: var(--heading-font);
        --marimo-cell-foreground: var(--ink);
        --marimo-cell-accent: var(--link);
        --marimo-cell-background: transparent;
        --marimo-cell-padding: 0;
        --marimo-cell-content-width: 100%;
      }

      #app-shell {
        box-sizing: border-box;
        margin: 0 auto;
        max-width: 72rem;
        padding: 3.5rem 2rem 6rem;
      }

      .eyebrow {
        color: var(--muted);
        font-size: 0.875rem;
        font-weight: 700;
        margin: 0 0 1.5rem;
      }

      .reading {
        display: grid;
        gap: 2rem;
        max-width: 42rem;
      }

      /* Squares: one drawing for the interactive model and the examples. */
      .square {
        display: block;
        height: auto;
        overflow: visible;
        width: 100%;
      }

      .square .region {
        transition:
          x 0.5s ease,
          y 0.5s ease,
          width 0.5s ease,
          height 0.5s ease,
          opacity 0.3s ease;
      }

      .square.entering .r-eh,
      .square.entering .r-enh {
        transition-delay: 0.3s;
      }

      .square.leaving .r-h,
      .square.leaving .r-not-h {
        transition-delay: 0.5s;
      }

      .square .r-h { fill: var(--h); }
      .square .r-not-h { fill: var(--not-h); }
      .square .r-eh { fill: var(--e-and-h); }
      .square .r-enh { fill: var(--e-and-not-h); }

      .square .frame {
        fill: none;
        stroke: var(--ink);
        stroke-width: 0.5;
      }

      .square .prior-mark {
        opacity: 0;
        stroke: var(--ink);
        stroke-dasharray: 2 1.5;
        stroke-width: 0.6;
        transition: opacity 0.3s ease;
      }

      .square.given-e .prior-mark {
        opacity: 1;
        transition-delay: 0.8s;
      }

      .square text {
        dominant-baseline: central;
        fill: var(--ink);
        font: 700 4.5px var(--text-font);
        text-anchor: middle;
        transition: opacity 0.2s ease;
      }

      .square text.on-dark {
        fill: var(--paper);
      }

      .square .prior-label {
        font-size: 3.5px;
        font-weight: 400;
        opacity: 0;
      }

      .square.given-e .prior-label {
        opacity: 1;
        transition-delay: 0.8s;
      }

      .square.entering text,
      .square.leaving text {
        opacity: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        .square *,
        .square .prior-mark {
          transition: none !important;
        }
      }

      /* Worked examples */
      .examples {
        display: grid;
        gap: 2rem;
        margin-top: 6rem;
      }

      .examples > marimo-cell {
        max-width: 42rem;
      }

      .example-grid {
        display: grid;
        gap: 2.5rem;
        grid-template-columns: repeat(3, minmax(0, 1fr));
      }

      .example {
        border-top: 1px solid var(--rule);
        display: grid;
        gap: 1rem;
        grid-template-rows: auto 1fr;
        margin: 0;
        padding-top: 1rem;
      }

      .pair {
        align-self: end;
      }

      .pair-squares {
        align-items: start;
        display: grid;
        gap: 0.75rem;
        grid-template-columns: minmax(0, 7.5rem) auto minmax(0, 7.5rem);
        justify-content: start;
      }

      .pair-squares .arrow {
        color: var(--muted);
        margin-top: 2.75rem;
      }

      .mini span {
        color: var(--muted);
        display: block;
        font-size: 0.75rem;
        line-height: 1.4;
        margin-top: 0.375rem;
      }

      .shift {
        font-variant-numeric: tabular-nums;
        margin: 0.5rem 0 0;
      }

      .shift strong {
        color: var(--e-and-h);
      }

      /* Interactive model */
      .interactive {
        margin-top: 6rem;
      }

      .interactive > marimo-cell {
        max-width: 42rem;
      }

      .lesson {
        align-items: start;
        display: grid;
        gap: 4rem;
        grid-template-columns: minmax(0, 36rem) minmax(0, 1fr);
      }

      .workbench {
        display: grid;
        gap: 1.25rem;
        max-width: 24rem;
      }

      /* Stick beside the walkthrough only when the whole panel fits on screen. */
      @media (min-width: 961px) and (min-height: 46rem) {
        .workbench {
          position: sticky;
          top: 1.5rem;
        }
      }

      .controls {
        display: grid;
        gap: 0.25rem;
      }

      .model {
        display: grid;
        gap: 0.75rem;
        margin: 0;
      }

      .mode {
        border: 1px solid var(--rule);
        border-radius: 6px;
        display: inline-flex;
        justify-self: start;
        padding: 2px;
      }

      .mode button {
        background: none;
        border: 0;
        border-radius: 4px;
        color: var(--muted);
        cursor: pointer;
        font: 700 0.875rem/1 var(--text-font);
        padding: 0.5rem 0.75rem;
      }

      .mode button[aria-pressed="true"] {
        background: var(--ink);
        color: var(--paper);
      }

      .mode button:disabled {
        cursor: not-allowed;
        opacity: 0.4;
      }

      .mode button:focus-visible {
        outline: 2px solid var(--link);
        outline-offset: 2px;
      }

      .legend {
        color: var(--muted);
        display: flex;
        flex-wrap: wrap;
        font-size: 0.875rem;
        gap: 0.25rem 1rem;
        list-style: none;
        margin: 0;
        padding: 0;
      }

      .legend li::before {
        border-radius: 2px;
        content: "";
        display: inline-block;
        height: 0.75rem;
        margin-right: 0.375rem;
        vertical-align: -0.0625rem;
        width: 0.75rem;
      }

      .legend .h::before { background: var(--h); }
      .legend .e-and-h::before { background: var(--e-and-h); }
      .legend .e-and-not-h::before { background: var(--e-and-not-h); }

      .legend b {
        color: var(--ink);
        margin-right: 0.25rem;
      }

      .readout {
        display: grid;
        font-variant-numeric: tabular-nums;
        gap: 1.25rem;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        margin: 0;
      }

      .readout dt {
        font-size: 0.875rem;
        font-weight: 700;
        line-height: 1.3;
      }

      .readout .symbol {
        color: var(--muted);
        display: block;
        font-size: 0.75rem;
        font-weight: 400;
      }

      .readout dd {
        font: 600 1.75rem/1.2 var(--heading-font);
        margin: 0.25rem 0 0;
      }

      .readout .posterior {
        color: var(--e-and-h);
      }

      .note {
        color: var(--muted);
        font-size: 0.875rem;
        line-height: 1.5;
        margin: 0;
      }

      .closing {
        display: grid;
        gap: 2rem;
        margin-top: 6rem;
        max-width: 42rem;
      }

      @media (max-width: 960px) {
        #app-shell {
          padding: 2.5rem 1rem 4rem;
        }

        .lesson {
          gap: 3rem;
          grid-template-columns: minmax(0, 1fr);
        }

        .example-grid {
          grid-template-columns: minmax(0, 1fr);
        }

        .examples,
        .interactive,
        .closing {
          margin-top: 4rem;
        }
      }
    </style>
  </head>
  <body>
    <main id="app-shell">
      <p class="eyebrow">Probability · Lesson 8</p>

      <article class="reading">
        <marimo-cell name="introduction"></marimo-cell>
        <marimo-cell name="bayesian_reasoning"></marimo-cell>
        <marimo-cell name="formula"></marimo-cell>
        <marimo-cell name="components"></marimo-cell>
      </article>

      <section class="examples">
        <marimo-cell name="real_world_examples"></marimo-cell>
        <div class="example-grid">
          <figure class="example">
            <marimo-output value="medical_explanation"></marimo-output>
            <div
              class="pair"
              data-example="medical"
              aria-busy="true"
              data-marimo-lens-inputs="medical-p-h medical-p-e-h medical-p-e-not-h medical-posterior"
              data-marimo-lens-label="Medical test, before and after a positive test"
              data-marimo-lens-render-source='{"path":"index.html","symbol":"drawSquare"}'
            >
              <div hidden>
                <span id="medical-p-h" hidden mo-value="p_disease"></span>
                <span id="medical-p-e-h" hidden mo-value="p_positive_given_disease"></span>
                <span id="medical-p-e-not-h" hidden mo-value="p_positive_given_healthy"></span>
                <span id="medical-posterior" hidden mo-value="medical_posterior"></span>
              </div>
            </div>
          </figure>
          <figure class="example">
            <marimo-output value="student_explanation"></marimo-output>
            <div
              class="pair"
              data-example="student"
              aria-busy="true"
              data-marimo-lens-inputs="student-p-h student-p-e-h student-p-e-not-h student-posterior"
              data-marimo-lens-label="Student ability, before and after a good grade"
              data-marimo-lens-render-source='{"path":"index.html","symbol":"drawSquare"}'
            >
              <div hidden>
                <span id="student-p-h" hidden mo-value="p_high_ability"></span>
                <span id="student-p-e-h" hidden mo-value="p_good_grade_given_high"></span>
                <span id="student-p-e-not-h" hidden mo-value="p_good_grade_given_low"></span>
                <span id="student-posterior" hidden mo-value="student_posterior"></span>
              </div>
            </div>
          </figure>
          <figure class="example">
            <marimo-output value="location_explanation"></marimo-output>
            <div
              class="pair"
              data-example="location"
              aria-busy="true"
              data-marimo-lens-inputs="location-p-h location-p-e-h location-p-e-not-h location-posterior"
              data-marimo-lens-label="Phone location, before and after a strong signal"
              data-marimo-lens-render-source='{"path":"index.html","symbol":"drawSquare"}'
            >
              <div hidden>
                <span id="location-p-h" hidden mo-value="p_location_a"></span>
                <span id="location-p-e-h" hidden mo-value="p_strong_signal_at_a"></span>
                <span id="location-p-e-not-h" hidden mo-value="p_strong_signal_elsewhere"></span>
                <span id="location-posterior" hidden mo-value="location_posterior"></span>
              </div>
            </div>
          </figure>
        </div>
      </section>

      <section class="interactive">
        <marimo-cell name="interactive_heading"></marimo-cell>
        <div class="lesson">
          <div class="reading">
            <marimo-cell name="area_model"></marimo-cell>
            <marimo-output value="area_walkthrough"></marimo-output>
          </div>

          <aside class="workbench" aria-label="Interactive area model">
            <div class="controls">
              <marimo-output value="p_h"></marimo-output>
              <marimo-output value="p_e_given_h"></marimo-output>
              <marimo-output value="p_e_given_not_h"></marimo-output>
            </div>

            <figure
              class="model"
              aria-busy="true"
              data-marimo-lens-inputs="area-inputs posterior-value"
              data-marimo-lens-label="Area model"
              data-marimo-lens-detail="The page draws the regions from the slider values and, after E, from the posterior."
              data-marimo-lens-render-source='{"path":"index.html","symbol":"drawSquare"}'
            >
              <div class="mode" role="group" aria-label="Outcomes shown">
                <button type="button" data-mode="all" aria-pressed="true">All outcomes</button>
                <button type="button" data-mode="given-e" aria-pressed="false">
                  Only where E happened
                </button>
              </div>
              <svg id="model" class="square" viewBox="-1 -1 102 102" role="img" data-labels>
                <title id="model-title">
                  The square of all outcomes, split into H and not H, with the outcomes
                  where E happens shaded teal
                </title>
              </svg>
              <figcaption>
                <ul class="legend">
                  <li class="h"><b>1</b>H</li>
                  <li class="e-and-h"><b>2</b>E and H</li>
                  <li class="e-and-not-h"><b>3</b>E and not H</li>
                </ul>
              </figcaption>
            </figure>

            <dl
              class="readout"
              data-marimo-lens-inputs="area-inputs p-e-value posterior-value"
              data-marimo-lens-label="Prior, evidence, and posterior"
              data-marimo-lens-render-source='{"path":"index.html","symbol":"drawReadout"}'
            >
              <div>
                <dt>Prior <span class="symbol">P(H), before E</span></dt>
                <dd id="prior">–</dd>
              </div>
              <div>
                <dt>Evidence <span class="symbol">P(E)</span></dt>
                <dd id="evidence">–</dd>
              </div>
              <div>
                <dt>Posterior <span class="symbol">P(H | E), after E</span></dt>
                <dd id="posterior" class="posterior">–</dd>
              </div>
            </dl>
            <p id="readout-note" class="note" role="status"></p>

            <div hidden>
              <span id="area-inputs" hidden mo-value="area_inputs"></span>
              <span id="p-e-value" hidden mo-value="p_e"></span>
              <span id="posterior-value" hidden mo-value="bayes_result"></span>
            </div>
          </aside>
        </div>
      </section>

      <section class="closing">
        <marimo-cell name="applications"></marimo-cell>
        <marimo-cell name="quiz"></marimo-cell>
        <marimo-cell name="summary"></marimo-cell>
      </section>
    </main>
    <script type="module">
      /** Subscribe an explicit `mo-value` host to current values and later updates. */
      const observeMarimoValue = (host, { onValue, onError = () => {} }) => {
        const sync = (event) => onValue(event.detail.value);
        const fail = (event) => onError(event.detail);
        host.addEventListener("marimo-value-updated", sync);
        host.addEventListener("marimo-value-error", fail);
        if (host.dataset.marimoError !== undefined) {
          onError({
            selector: host.getAttribute("mo-value")?.trim() ?? "",
            code: host.dataset.marimoErrorCode,
            message: host.dataset.marimoError,
            hint: host.dataset.marimoDiagnosticHint,
          });
        } else if (host.marimoValue !== undefined) {
          onValue(host.marimoValue);
        }
        return () => {
          host.removeEventListener("marimo-value-updated", sync);
          host.removeEventListener("marimo-value-error", fail);
        };
      };

      const SVG = "http://www.w3.org/2000/svg";
      const $ = (selector) => document.querySelector(selector);
      const subscriptions = [];

      // Whole percentages print without decimals, others with one: 1%, 8.8%, 49.1%.
      const percent = (p) => {
        const value = p * 100;
        return `${Math.abs(value - Math.round(value)) < 0.05 ? Math.round(value) : value.toFixed(1)}%`;
      };

      const make = (svg, tag, attributes) => {
        const element = document.createElementNS(SVG, tag);
        for (const [name, value] of Object.entries(attributes)) {
          element.setAttribute(name, value);
        }
        svg.append(element);
        return element;
      };

      const build = (svg) => {
        for (const name of ["r-h", "r-not-h", "r-eh", "r-enh"]) {
          make(svg, "rect", { class: `region ${name}` });
        }
        make(svg, "line", { class: "prior-mark", y1: -1, y2: 101 });
        make(svg, "rect", { class: "frame", x: 0, y: 0, width: 100, height: 100 });
        if (svg.hasAttribute("data-labels")) {
          for (const n of ["1", "2", "3"]) {
            make(svg, "text", { class: `n${n}` }).textContent = n;
          }
          make(svg, "text", { class: "prior-label", y: 4 }).textContent = "prior";
        }
      };

      // Set geometry as attributes and as CSS properties, so browsers that
      // support SVG geometry in CSS animate the change.
      const place = (element, geometry) => {
        for (const [name, value] of Object.entries(geometry)) {
          element.setAttribute(name, value);
          element.style[name] = `${value}px`;
        }
      };

      const label = (svg, n, x, y, width, height) => {
        const text = svg.querySelector(`.n${n}`);
        if (!text) return;
        text.setAttribute("x", x + width / 2);
        text.setAttribute("y", y + height / 2);
        text.style.display = width >= 7 && height >= 7 ? "" : "none";
      };

      /**
       * Draw the unit square of outcomes. With `conditioned`, keep only the
       * outcomes where E happened and stretch them to fill the square, so the
       * line between H and not H moves from the prior to the posterior.
       */
      const drawSquare = (svg, { pH, pEH, pENH, posterior, conditioned }) => {
        if (!svg.querySelector(".frame")) build(svg);
        const q = (selector) => svg.querySelector(selector);
        const w = pH * 100;
        const eh = pEH * 100;
        const enh = pENH * 100;
        place(q(".r-h"), { x: 0, y: 0, width: w, height: 100 });
        place(q(".r-not-h"), { x: w, y: 0, width: 100 - w, height: 100 });
        q(".prior-mark").setAttribute("x1", w);
        q(".prior-mark").setAttribute("x2", w);
        svg.classList.toggle("given-e", conditioned);
        q(".r-h").style.opacity = conditioned ? 0 : 1;
        q(".r-not-h").style.opacity = conditioned ? 0 : 1;
        if (conditioned) {
          const p = posterior * 100;
          place(q(".r-eh"), { x: 0, y: 0, width: p, height: 100 });
          place(q(".r-enh"), { x: p, y: 0, width: 100 - p, height: 100 });
          label(svg, 1, 0, 0, 0, 0);
          label(svg, 2, 0, 0, p, 100);
          label(svg, 3, p, 0, 100 - p, 100);
        } else {
          place(q(".r-eh"), { x: 0, y: 100 - eh, width: w, height: eh });
          place(q(".r-enh"), { x: w, y: 100 - enh, width: 100 - w, height: enh });
          label(svg, 1, 0, 0, w, 100 - eh);
          label(svg, 2, 0, 100 - eh, w, eh);
          label(svg, 3, w, 100 - enh, 100 - w, enh);
        }
        q(".n2")?.classList.add("on-dark");
        // Keep the "prior" label inside one region: right of the dashed line
        // when it fits, otherwise left of it, otherwise hidden.
        const priorLabel = q(".prior-label");
        if (priorLabel) {
          const p = posterior * 100;
          const inDark = w < p;
          const [start, end] = inDark ? [0, p] : [p, 100];
          const width = 9;
          const right = w + 1.5 + width <= end;
          const left = w - 1.5 - width >= start;
          priorLabel.setAttribute("x", right ? w + 1.5 : w - 1.5);
          priorLabel.style.textAnchor = right ? "start" : "end";
          priorLabel.style.display = right || left ? "" : "none";
          priorLabel.classList.toggle("on-dark", inDark);
        }
      };

      // Worked examples: the same square before and after the evidence.
      for (const pair of document.querySelectorAll(".pair")) {
        const id = pair.dataset.example;
        pair.insertAdjacentHTML(
          "beforeend",
          `<div class="pair-squares">
             <div class="mini">
               <svg class="square" viewBox="-1 -1 102 102" aria-hidden="true"></svg>
               <span>All outcomes</span>
             </div>
             <span class="arrow" aria-hidden="true">→</span>
             <div class="mini">
               <svg class="square" viewBox="-1 -1 102 102" aria-hidden="true"></svg>
               <span>Only where E happened</span>
             </div>
           </div>
           <p class="shift"></p>`,
        );
        const [before, after] = pair.querySelectorAll("svg");
        const values = {};
        const keys = { pH: "p-h", pEH: "p-e-h", pENH: "p-e-not-h", posterior: "posterior" };
        const redraw = () => {
          if (Object.keys(keys).some((key) => values[key] === undefined)) return;
          drawSquare(before, { ...values, conditioned: false });
          drawSquare(after, { ...values, conditioned: true });
          pair.querySelector(".shift").innerHTML =
            `Prior ${percent(values.pH)} → posterior <strong>${percent(values.posterior)}</strong>`;
          pair.setAttribute("aria-busy", "false");
        };
        for (const [key, suffix] of Object.entries(keys)) {
          subscriptions.push(
            observeMarimoValue(document.getElementById(`${id}-${suffix}`), {
              onValue: (value) => {
                values[key] = value;
                redraw();
              },
            }),
          );
        }
      }

      // Interactive model
      const model = $("#model");
      const buttons = document.querySelectorAll(".mode button");
      const state = { mode: location.hash === "#given-e" ? "given-e" : "all" };

      const drawModel = () => {
        if (!state.area) return;
        const conditioned = state.mode === "given-e" && state.posterior !== undefined;
        drawSquare(model, {
          pH: state.area.p_h,
          pEH: state.area.p_e_given_h,
          pENH: state.area.p_e_given_not_h,
          posterior: state.posterior,
          conditioned,
        });
        $("#model-title").textContent = conditioned
          ? "Only the outcomes where E happened, split into E and H and E and not H"
          : "The square of all outcomes, split into H and not H, with the outcomes where E happens shaded teal";
        $(".model").setAttribute("aria-busy", "false");
      };

      const drawReadout = () => {
        $("#prior").textContent = state.area ? percent(state.area.p_h) : "–";
        $("#evidence").textContent = state.pE === undefined ? "–" : percent(state.pE);
        $("#posterior").textContent =
          state.posterior === undefined ? "–" : percent(state.posterior);
      };

      const setMode = (mode) => {
        if (mode === state.mode) return;
        state.mode = mode;
        for (const button of buttons) {
          button.setAttribute("aria-pressed", String(button.dataset.mode === mode));
        }
        history.replaceState(null, "", mode === "given-e" ? "#given-e" : location.pathname + location.search);
        const phase = mode === "given-e" ? "entering" : "leaving";
        model.classList.add(phase);
        drawModel();
        setTimeout(() => model.classList.remove(phase), 900);
      };

      for (const button of buttons) {
        button.setAttribute("aria-pressed", String(button.dataset.mode === state.mode));
        button.addEventListener("click", () => setMode(button.dataset.mode));
      }
      window.addEventListener("hashchange", () =>
        setMode(location.hash === "#given-e" && !buttons[1].disabled ? "given-e" : "all"),
      );

      const update = (key) => (value) => {
        state[key] = value;
        if (key === "posterior") {
          $("#readout-note").textContent = "";
          buttons[1].disabled = false;
        }
        drawModel();
        drawReadout();
      };

      // P(E) is zero when neither column has evidence. The notebook cell that
      // computes P(E) and the posterior then fails, so both values are missing
      // and there are no outcomes left to keep.
      const clearPosterior = () => {
        state.pE = undefined;
        state.posterior = undefined;
        buttons[1].disabled = true;
        if (state.mode === "given-e") setMode("all");
        drawModel();
        drawReadout();
        $("#readout-note").textContent =
          "With these settings E never happens, so there is nothing to update on.";
      };

      for (const [selector, onValue, onError] of [
        ["#area-inputs", update("area")],
        ["#p-e-value", update("pE"), clearPosterior],
        ["#posterior-value", update("posterior"), clearPosterior],
      ]) {
        subscriptions.push(observeMarimoValue($(selector), { onValue, onError }));
      }
      window.addEventListener("pagehide", () => subscriptions.forEach((stop) => stop()), {
        once: true,
      });

      $("#app-shell").setAttribute("data-ready", "");
    </script>
  </body>
</html>
